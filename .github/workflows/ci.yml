name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  # Storage behaviour is only real against a real database and a real Redis.
  # The runner provides Docker, so testcontainers starts them here; the unit
  # matrix above stays hermetic and fast.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Integration tests (MySQL + Redis)
        run: go test -tags=integration ./... -count=1 -timeout 15m
